services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: agentic_rag
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d agentic_rag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["qdrant"]
    volumes: [qdrantdata:/qdrant/storage]
    ports: ["6333:6333"]

  backend:
    build:
      context: ./backend
      args:
        BASE: ${BACKEND_BASE_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:${POSTGRES_PASSWORD:-rag}@postgres:5432/agentic_rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      MCP_FS_ROOT: /app/data/uploads
      MCP_CONFIG_PATH: /app/mcp_servers.json
    volumes:
      - appdata:/app/data
      - hfcache:/models
      - ./backend/mcp_servers.json:/app/mcp_servers.json
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MONGODB_URI: ${MONGODB_URI}
    depends_on: [backend]

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  appdata: {}
  hfcache: {}

# Render Blueprint Configuration (https://render.com/docs/blueprint-spec)
# Single Web Service: Runs BOTH Next.js Frontend + FastAPI Backend in 1 instance
version: "1"

services:
  - type: web
    name: agentic-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: LOG_LEVEL
        value: INFO

      # --- Groq Cloud LLM ---
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL_PLANNER
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_GENERATOR
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_VALIDATOR
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_CODE
        value: openai/gpt-oss-120b

      # --- Local Embedding & Vector Search (CPU) ---
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: DEVICE
        value: cpu
      - key: VECTOR_BACKEND
        value: faiss
      - key: DATA_DIR
        value: ./data
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/rag.db
      - key: CORS_ORIGINS
        value: '["*"]'

      # --- Frontend & NextAuth Configuration ---
      - key: NEXTAUTH_URL
        sync: false # Set to your Render URL, e.g. https://agentic-ai.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false

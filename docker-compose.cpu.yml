services:
  backend:
    build:
      args:
        BASE: python:3.11-slim
    environment:
      LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      LLM_DEVICE: cpu
      DEVICE: cpu
      USE_HYDE: "false"
      MULTI_QUERY_COUNT: "1"
    deploy: !reset {}
